# Builds the Vite page and publishes it to GitHub Pages.
#
# Requires one manual setting, once: repo Settings -> Pages -> Source:
# "GitHub Actions". Without it, the deploy step fails with a 404.
#
# The page fetches data.json from the raw URL at runtime, so fresh data does
# NOT need a rebuild — that is why the hourly collector's data commits are
# excluded below. Otherwise every hourly bot commit would redeploy the site.

name: deploy-pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "sentiment.db"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
